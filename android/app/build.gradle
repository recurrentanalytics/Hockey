plugins { id 'com.android.application' }

android {
    namespace 'de.boniborstentiere.hockey'
    compileSdk 35
    defaultConfig {
        applicationId 'de.boniborstentiere.hockey'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.9'
    }
    signingConfigs {
        // keystore outside the repository (path and passwords from environment variables)
        club {
            storeFile System.getenv('BONI_KEYSTORE') ? file(System.getenv('BONI_KEYSTORE')) : null
            storePassword System.getenv('BONI_KEYSTORE_PASS')
            keyAlias 'boni'
            keyPassword System.getenv('BONI_KEYSTORE_PASS')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('BONI_KEYSTORE') ? signingConfigs.club : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // the web game is copied in by tools/android/build.sh (not kept in git)
    androidResources { noCompress += ['glb', 'wasm', 'mp3', 'jpg', 'png'] }
}
