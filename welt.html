<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f1a" />
  <title>Borstenboom! – Der Boni als Welt</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="icon" href="assets/app/icon-192.png" />
  <!--
    Weltansicht des Bonifatiusplatzes: amtliches Luftbild, echte Gebäudegrundrisse als Volumen, Straßen,
    Wege, Bäume und der Bolzplatz (Daten: locations/boni/geo, erzeugt von tools/ort/geodaten.py).
    Start: python3 serve.py, dann http://localhost:8000/welt.html   (?sicht=oben|schraeg|spiel|platz)
    Braucht Netz: CesiumJS vom CDN, Luftbild live vom LGLN. Noch kein Spiel, nur die Welt zum Ansehen.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #0e0f1a; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #f4f1e8; }
    #cesium { position: fixed; inset: 0; }
    #cesium .cesium-viewer-bottom { left: auto; right: 6px; }
    #tafel { position: fixed; left: 10px; top: 10px; width: 250px; max-height: calc(100% - 20px); overflow: auto; box-sizing: border-box;
             background: #14151fdd; border: 1px solid #ffffff22; border-radius: 8px; padding: 10px 12px; z-index: 2; }
    h1 { font-size: 15px; margin: 0 0 6px; color: #ffd23f; }
    h2 { font-size: 11px; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .06em; color: #a9a7b8; }
    label { display: block; padding: 1px 0; cursor: pointer; } small { color: #a9a7b8; }
    button { font: inherit; color: #14151f; background: #ffd23f; border: 0; border-radius: 5px; padding: 4px 8px; margin: 0 4px 4px 0; cursor: pointer; }
    #lage, #info { white-space: pre-wrap; word-break: break-word; font-variant-numeric: tabular-nums; }
    #info { background: #00000055; border-radius: 5px; padding: 5px 7px; min-height: 2.6em; }
    #status { color: #ffd23f; }
    #spielstart { display: none; position: fixed; left: 50%; bottom: 9%; transform: translateX(-50%); z-index: 3; text-align: center; text-decoration: none;
                  font: 700 20px/1.3 system-ui, sans-serif; color: #14151f; background: #ffd23f; border: 3px solid #14151f; border-radius: 10px; padding: 10px 22px; box-shadow: 0 4px 0 #14151f; }
    #spielstart small { font-weight: 500; color: #14151f; }
    /* the match runs in this same scene: the game's canvas lies over the 3D view, the panel steps aside */
    #screen { display: none; z-index: 4; background: transparent !important; }
    body.imspiel #screen { display: block; }
    body.imspiel #tafel, body.imspiel #spielstart { display: none !important; }
    #verlassen { display: none; position: fixed; right: 10px; top: 10px; z-index: 6; font: 700 15px system-ui, sans-serif; padding: 8px 12px; border: 2px solid #14151f; }
    body.imspiel #verlassen { display: block; }
    @media (max-width: 640px) { #tafel { width: 190px; font-size: 12px; } }
  </style>
</head>
<body>
  <div id="cesium"></div>
  <div id="tafel">
    <h1>Der Boni als Welt</h1>
    <small>Stand 14 · 27.11.</small>
    <div id="status">…</div>
    <h2>Ansicht</h2>
    <button data-sicht="schraeg">Schrägblick</button><button data-sicht="oben">Von oben</button><button data-sicht="spiel">Spielkamera</button><button data-sicht="platz">Platz</button><button data-sicht="fahren">Losfahren</button>
    <small>Ziehen dreht und verschiebt, Mausrad zoomt, Strg + Ziehen kippt (Touch: zwei Finger).</small>
    <h2>Ebenen</h2>
    <div id="ebenen"></div>
    <small id="bibliothek"></small>
    <h2>Zeiger</h2>
    <div id="lage">–</div>
    <h2>Objekt (Klick)</h2>
    <div id="info">Auf ein Gebäude, einen Weg oder Baum klicken.</div>
  </div>
  <canvas id="screen" tabindex="0"></canvas>
  <a id="spielstart" href="test.html">Spiel starten ▶<br><small>Hockey auf dem Boni, 3 gegen 3</small></a>
  <button id="verlassen" type="button">◀ Platz verlassen</button>
  <script src="src/native/pads.js"></script>
  <script type="module" src="src/welt/welt.js?v=14"></script>
</body>
</html>
