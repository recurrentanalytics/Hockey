<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0e0f1a" />
  <title>Anflug auf den Boni</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/app/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/app/icon-192.png" />
  <style>
    html, body { margin: 0; height: 100%; background: #0e0f1a; overflow: hidden; }
    #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
    #cesium { position: fixed; inset: 0; }
    #cesium .cesium-viewer-bottom { left: auto; right: 6px; bottom: 22px; }
    #status { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: clamp(16px, 3vw, 26px); transition: opacity .5s; text-shadow: 0 2px 0 #16110d; }
    #ui { position: fixed; inset: 0; pointer-events: none; font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; color: #fff; }
    #title { position: absolute; left: 0; right: 0; top: 7%; text-align: center; opacity: 0; transition: opacity .8s, transform .8s; transform: translateY(-12px);
             text-shadow: 0 3px 0 #16110d, 0 0 18px rgba(0,0,0,.55); }
    #title.on { opacity: 1; transform: none; }
    #title .club { font-size: clamp(26px, 6vw, 64px); letter-spacing: .04em; color: #ffd23f; -webkit-text-stroke: 2px #16110d; }
    #title .sub { font-size: clamp(14px, 2.6vw, 26px); margin-top: .3em; }
    #go { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); pointer-events: auto; opacity: 0; transition: opacity .6s;
          font: inherit; font-size: clamp(16px, 2.6vw, 24px); color: #16110d; background: #ffd23f; border: 3px solid #16110d; border-radius: 999px;
          padding: .55em 1.4em; box-shadow: 0 4px 0 #16110d; cursor: pointer; }
    #go.on { opacity: 1; }
    #credit { position: absolute; right: 8px; bottom: 6px; font: 11px/1.2 Arial, sans-serif; color: rgba(255,255,255,.85); text-shadow: 0 1px 2px #000; }
    #token { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 520px); display: none; pointer-events: auto;
             background: rgba(14,15,26,.92); border: 3px solid #ffd23f; border-radius: 14px; padding: 18px 20px; font: 15px/1.4 Arial, sans-serif; color: #fff; }
    #token h2 { margin: 0 0 8px; font: 20px "Arial Black", Arial, sans-serif; color: #ffd23f; }
    #token input { width: 100%; box-sizing: border-box; margin: 10px 0; padding: 10px; font: 14px monospace; border-radius: 8px; border: 2px solid #ffd23f; background: #1b1c2b; color: #fff; }
    #token button { font: 16px "Arial Black", Arial, sans-serif; padding: 9px 16px; border-radius: 999px; border: 3px solid #16110d; background: #ffd23f; color: #16110d; margin-right: 8px; cursor: pointer; }
    #token button.alt { background: #3a3b4f; color: #fff; }
    #hint { position: absolute; left: 8px; bottom: 6px; font: 11px/1.2 Arial, sans-serif; color: rgba(255,255,255,.7); text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <div id="cesium"></div>
  <canvas id="gl"></canvas>
  <canvas id="screen" tabindex="0" style="display:none"></canvas>
  <div id="ui">
    <div id="title"><div class="club">BONI BORSTENTIERE</div><div class="sub">Das große Spiel am Boni</div></div>
    <button id="go" type="button">Spiel starten</button>
    <div id="hint">Tippen: überspringen · R: nochmal</div>
    <div id="status"></div>
    <div id="token">
      <h2>3D-Ansicht freischalten</h2>
      <div>Für den echten Boni in 3D einmal den Cesium-ion-Token des Vereins einfügen. Er wird nur auf diesem Gerät gespeichert.</div>
      <input id="tokenInput" type="password" autocomplete="off" placeholder="Token einfügen" />
      <button id="tokenOk" type="button">Los</button><button id="tokenSkip" class="alt" type="button">Ohne 3D spielen</button>
    </div>
    <div id="credit">Geodaten © GeoBasis-DE / LGLN, CC BY 4.0</div>
  </div>
  <script src="src/native/pads.js"></script>
  <script type="module" src="src/intro/main.js"></script>
  <script>if ('serviceWorker' in navigator && !window.BoniAndroid) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
